[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valhallog"
version = "0.1.0"
description = "A simple Textual interface for browsing system logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.13",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
valhallog = "valhallog.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
